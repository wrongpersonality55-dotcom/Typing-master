#inp{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
.label{font-size:.72rem;font-weight:500;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid var(--border);font-size:.82rem;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.top .tgt{color:var(--acc)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:44px;padding:40px 0}
.topic{color:var(--dim);font-size:.82rem;margin-bottom:18px}
#text{position:relative;font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;font-size:1.45rem;line-height:2.1;color:var(--dim);white-space:pre-wrap;word-break:break-word;user-select:none;max-width:780px}
#text span.c{transition:color .08s}
#text .ok{color:var(--text)}
#text .bad{color:#fca5a5;background:var(--err);box-shadow:inset 0 -2px rgba(239,68,68,.65)}
#caret{position:absolute;left:0;top:0;width:2px;border-radius:1px;background:var(--acc);box-shadow:0 0 10px rgba(16,185,129,.6);transition:transform .09s cubic-bezier(.3,.7,.4,1);pointer-events:none}
#caret.idle{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
.hint{margin-top:16px;color:var(--dim);font-size:.8rem;transition:opacity .3s}
.hint.off{opacity:0}
.tele{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.lane{display:grid;grid-template-columns:48px 1fr 128px;align-items:center;gap:14px}
.lane .r{text-align:right;font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--mute)}
.lane .r.up{color:var(--acc)}
.track{position:relative;height:22px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border)}
.track::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;background:repeating-linear-gradient(90deg,var(--border) 0 1px,transparent 1px 10%);opacity:.8;border-right:1px solid var(--mute)}
.fill{position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;transform-origin:left;transform:scaleX(0);background:var(--acc)}
.pace .fill{background:var(--dim)}
.node{position:absolute;left:0;top:0;width:6px;height:22px;border-radius:3px;background:var(--acc);box-shadow:0 0 14px rgba(16,185,129,.7);will-change:transform}
.pace .node{background:var(--mute);box-shadow:0 0 10px rgba(161,161,170,.35)}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 26px;border-top:1px solid var(--border)}
.metrics{display:flex;gap:44px}
.metrics b{display:block;font-size:2rem;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.ctl{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--border);color:var(--mute);border-radius:7px;padding:8px 12px;font-size:.78rem;font-weight:500;transition:border-color .15s,color .15s}
.ghost:hover{border-color:var(--dim);color:var(--text)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(10,10,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .28s,visibility 0s .28s;z-index:10}
.ov.show{opacity:1;visibility:visible;transition:opacity .28s}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px;transform:translateY(10px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ov.show .card{transform:none}
.status{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.status h2{margin:0;font-size:1.05rem;font-weight:600}
.chip{font-size:.72rem;font-weight:600;letter-spacing:.08em;padding:4px 9px;border-radius:5px;border:1px solid}
.chip.pass{color:var(--acc);border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.08)}
.chip.fail{color:#fca5a5;border-color:rgba(239,68,68,.4);background:var(--err)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.grid div{background:var(--bg);padding:14px 16px}
.grid b{display:block;font-size:1.6rem;font-weight:300;margin-top:4px;font-variant-numeric:tabular-nums}
.delta{font-size:.84rem;color:var(--mute);margin:0 0 22px}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:11px 14px;border-radius:8px;font-size:.88rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text)}
.btns .pri{background:var(--acc);border-color:var(--acc);color:#04251b}
kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.72rem;opacity:.65;margin-left:6px}
@media(max-width:640px){#text{font-size:1.1rem}.metrics{gap:22px}.metrics b{font-size:1.5rem}.lane{grid-template-columns:36px 1fr 86px;gap:10px}.lane .r{font-size:.74rem}.ctl .ghost{padding:7px 9px}main{gap:30px}}
html{height:100%;height:100dvh}
body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#inp{-webkit-user-select:text;user-select:text}
.shell{height:100%;display:flex}
.nav{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none;padding:18px 8px;background:var(--surface);border-right:1px solid var(--border)}
.brand{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;margin-bottom:18px}
.brand svg{width:20px;height:20px;stroke:#04251b;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:10px 0;background:none;border:0;border-radius:10px;color:var(--mute);font-size:.68rem;font-weight:500;transition:color .15s,background .15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--text)}.tab.on{color:var(--acc);background:rgba(16,185,129,.1)}
.view{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 24px}
.screen{display:none;flex:1;min-height:0;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;width:100%;max-width:880px;margin:0 auto}
.screen.on{display:flex}
.h{font-size:1.3rem;font-weight:600;margin:26px 0 18px;letter-spacing:-.01em}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sgrid div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.sgrid b{display:block;font-size:1.8rem;font-weight:300;margin-top:6px;font-variant-numeric:tabular-nums}
#reset{align-self:flex-start}
@media(max-width:760px){.shell{flex-direction:column-reverse}.nav{flex-direction:row;width:100%;justify-content:space-around;padding:6px 10px;border-right:0;border-top:1px solid var(--border)}.brand{display:none}.tab{flex:1;padding:8px 0}.view{padding:0 16px}}
.segs{display:block;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex:1;max-width:180px}
.segs i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.pbox{max-height:min(38vh,300px);overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.pbox::-webkit-scrollbar{display:none}
.note{color:var(--mute);font-size:.84rem;margin:-6px 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;padding-bottom:24px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);transition:border-color .15s,background .15s}
.tile b{font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile small{font-size:.66rem;color:var(--dim)}
.tile:disabled{opacity:.35;cursor:not-allowed}
.tile:hover:not(:disabled){border-color:var(--acc)}
.tile.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.07)}
.tile.ok small{color:var(--acc)}
.tile.cur{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the passage shown on screen">
<div class="shell">
  <nav class="nav" aria-label="Main">
    <div class="brand" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 7l5 5-5 5M13 17h5"/></svg></div>
    <button class="tab on" data-v="race" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg><span>Race</span></button>
    <button class="tab" data-v="levels"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Levels</span></button>
    <button class="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
  </nav>
  <div class="view"><div class="screen on" id="v-race">
  <header class="top"><span id="lvl">LVL 01</span><nav class="segs" id="segs" aria-hidden="true"></nav><span class="tgt" id="tgt">TARGET: 25 WPM</span></header>

  <main>
    <section aria-label="Passage">
      <div class="topic" id="topic"></div>
      <div class="pbox" id="pbox"><div id="text"><span id="chars"></span><i id="caret"></i></div></div>
      <div class="hint" id="hint">Start typing to begin. Esc restarts the level.</div>
    </section>

    <section class="tele" aria-label="Race telemetry">
      <div class="lane user"><span class="label">You</span><div class="track"><div class="fill"></div><div class="node"></div></div><span class="r up" id="lead">Ready</span></div>
      <div class="lane pace"><span class="label">Pace</span><div class="track"><div class="fill"></div><div class="node"></div></div><span class="r" id="pacew">25 WPM</span></div>
    </section>
  </main>

  <footer class="foot">
    <div class="metrics">
      <div><span class="label">Time</span><b id="tm">0.0s</b></div>
      <div><span class="label">WPM</span><b id="wpm">0</b></div>
      <div><span class="label">Accuracy</span><b id="acc">100%</b></div>
    </div>
    <div class="ctl"><button class="ghost" id="snd" aria-pressed="true">Sound on</button><button class="ghost" id="rst">Restart</button></div>
  </footer>
</div>
  <section class="screen" id="v-levels"><h1 class="h">Levels</h1><p class="note" id="lnote"></p><div class="tiles" id="levels"></div></section>
  <section class="screen" id="v-stats"><h1 class="h">Stats</h1><div class="sgrid" id="sgrid"></div><button class="ghost" id="reset">Reset progress</button></section>
  </div>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ot">
  <div class="card">
    <div class="status"><h2 id="ot"></h2><span class="chip" id="chip"></span></div>
    <div class="grid">
      <div><span class="label">WPM</span><b id="s1"></b></div><div><span class="label">Accuracy</span><b id="s2"></b></div>
      <div><span class="label">Consistency</span><b id="s3"></b></div><div><span class="label">Time</span><b id="s4"></b></div>
    </div>
    <p class="delta" id="dl"></p>
    <div class="btns"><button class="pri" id="b1"></button><button id="b2">Retry<kbd>Tab</kbd></button></div>
  </div>
</div>

<div class="ov" id="rs" role="dialog" aria-modal="true" aria-labelledby="rt">
  <div class="card"><div class="status"><h2 id="rt">Welcome back</h2></div><p class="delta" id="rd"></p>
  <div class="btns"><button class="pri" id="rc1"></button><button id="rc2">Start from Level 1</button></div></div>
</div>

<script>
/* Level data: 100 levels. Level 1 = 30 words, +10 words per level (Level 100 = 1020 words).
   Target WPM rises gently from 25 to about 79. Tune the numbers below to taste. */
const TOTAL_LEVELS = 100;
const START_WORDS = 30, WORDS_STEP = 10;
const targetWpm = i => 25 + Math.round(i * 0.55);

const POOL = [
["Computer science",[
"An algorithm is a finite list of precise steps that solves a problem, and we judge it by how its cost grows as the input grows.",
"A hash table stores values by key, which lets a program find an item in roughly constant time instead of searching through every entry.",
"Recursion solves a large problem by reducing it to smaller copies of itself until a simple base case can be answered directly.",
"Compilers translate human readable source code into instructions that a processor can execute, and they often rewrite that code to run faster.",
"Version control records every change to a project, so a team can compare, review, and safely undo work without losing history.",
"Encryption turns readable data into scrambled text that only someone holding the correct key can convert back into its original form.",
"A database index works like the index of a book, pointing straight to the right page instead of forcing a reader to scan everything.",
"Caching keeps a copy of frequently used data close to where it is needed, trading a little memory for a large reduction in waiting time.",
"Operating systems share one processor among many programs by switching between them so quickly that each seems to have the machine to itself.",
"A stack follows last in, first out order, while a queue follows first in, first out, and each suits a different kind of problem."]],
["Cognitive psychology",[
"Working memory can hold only a handful of items at once, so complex ideas must be broken into smaller pieces before they can be understood.",
"Chunking groups related pieces of information into a single unit, which is why experts seem to remember so much more than novices.",
"Spaced repetition schedules reviews just before a memory fades, and this effort of recalling makes the knowledge last much longer than cramming.",
"Attention is a limited resource, and every notification that interrupts a task forces the brain to pay a cost to switch back.",
"Deliberate practice means working at the edge of your ability with clear goals and immediate feedback, rather than repeating what already feels easy.",
"Confirmation bias leads people to notice evidence that supports what they already believe and to overlook evidence that points the other way.",
"Sleep helps the brain consolidate new memories, replaying the day and strengthening the connections that matter most for learning.",
"Habits form when a cue triggers a routine that delivers a reward, and repeating that loop often turns effortful choices into automatic behavior.",
"People tend to overestimate how much they will accomplish in a day and underestimate how much they can achieve over several years.",
"Making mistakes during practice is not a sign of failure, because error correction is one of the main ways the brain refines a skill."]],
["Economics",[
"Opportunity cost is the value of the best alternative you give up when making a choice, and every decision carries one.",
"When demand rises faster than supply, prices tend to climb, which signals producers to make more and encourages buyers to use less.",
"Compound interest earns returns on earlier returns, so a small amount invested early can grow far beyond what steady saving alone would suggest.",
"Inflation is a general rise in prices over time, meaning that the same amount of money slowly buys a little less each year.",
"Specialization lets each person or country focus on what it does best, and trade then allows everyone to enjoy more than they could produce alone.",
"A market works best when buyers and sellers have good information, because accurate prices help resources flow to their most valuable uses.",
"Sunk costs are expenses that cannot be recovered, and wise decision makers ignore them when judging whether to continue a project.",
"Productivity growth, which means producing more with the same inputs, is the main reason living standards rise over the long run.",
"Incentives shape behavior in surprising ways, so a policy that ignores how people will respond often produces the opposite of what was intended.",
"Scarcity forces every society to choose among competing goals, since time, money, and attention can each be spent only once."]],
["Modern engineering",[
"Distributed systems fail in partial and surprising ways, so engineers design for failure rather than against it.",
"Redundancy, retries with backoff, and idempotent operations let a service recover from a fault without anyone noticing that something went wrong.",
"Latency compounds across services: if a request touches 12 components and each has a 99.9% success rate, roughly 1.2% of requests still fail.",
"Good monitoring turns a mysterious outage into a short investigation by showing which component slowed down first and what changed just before.",
"Automated tests act as a safety net, letting engineers change code with confidence because mistakes are caught within minutes instead of months.",
"A well designed interface hides complexity, allowing people to use a powerful system without needing to understand every detail inside it.",
"Load balancers spread incoming requests across many servers so that no single machine becomes overwhelmed and the whole service stays responsive.",
"Renewable energy systems depend on storage, because the sun and wind do not always match the moment when electricity is actually needed.",
"Engineers often build a small prototype first, since a cheap experiment can reveal a flawed assumption before major resources are committed.",
"Reliability is rarely achieved by a single clever trick; it comes from many small habits such as reviews, drills, and careful documentation."]],
["Science and learning",[
"Light travels at 299,792 kilometers per second, yet the nearest star beyond the Sun is still 4.2 light-years away.",
"The scientific method relies on testing ideas against evidence, and a good hypothesis is one that could clearly be proven wrong.",
"Vaccines train the immune system to recognize a threat in advance, so the body can respond quickly if the real germ ever appears.",
"The printing press made books cheaper and more widely available, which helped knowledge spread faster than at any earlier moment in history.",
"In 1969, Apollo 11 carried three astronauts to the Moon, and the mission proved that careful planning and teamwork can make an impossible idea real.",
"Measurement matters because what we cannot measure we can rarely improve, and honest numbers reveal progress that feelings often hide.",
"Small improvements repeated every day compound over time, so consistency usually beats occasional bursts of intense effort.",
"A clear question is half of a solution, because it tells you what evidence to look for and when you have found it.",
"Reading widely gives the mind more patterns to draw from, and new problems often turn out to resemble old ones in disguise.",
"Writing forces vague thoughts into exact sentences, which is why explaining an idea to someone else is one of the fastest ways to understand it.",
"Plate tectonics describes how the rigid pieces of the Earth surface drift slowly over time, building mountains and triggering earthquakes along their edges.",
"Photosynthesis lets plants convert sunlight, water, and carbon dioxide into sugar and oxygen, supplying the energy that supports nearly every food chain.",
"The internet is a network of networks that agree on shared rules for sending data, which lets very different machines communicate.",
"Statistics helps us separate real patterns from random noise, but a result is only as trustworthy as the way the data was collected.",
"Good teachers ask questions that reveal how a student is thinking, because fixing a misunderstanding is easier once it is visible.",
"The first transistors replaced bulky vacuum tubes, and decades of shrinking them made modern computers faster, cheaper, and small enough to carry.",
"Patience is a skill that grows with use, and each time you finish a difficult task you strengthen your ability to begin the next one.",
"Trade-offs are unavoidable in design, so the real work is deciding which qualities matter most and accepting the costs of that choice.",
"Curiosity drives learning more reliably than pressure does, because people explore deeply when they want to know the answer for themselves.",
"Feedback loops either amplify change or keep a system stable, and spotting which kind you are in explains much of how complex systems behave."]]
].flatMap(([t, list]) => list.map(s => [t, s]));

const LV = Array.from({ length: TOTAL_LEVELS }, (_, i) => ({
  n: i + 1, words: START_WORDS + WORDS_STEP * i, wpm: targetWpm(i), topic: '', text: ''
}));

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* A fresh random passage with exactly l.words words, every time a level is started. */
function makeText(l) {
  const out = []; let n = 0, q = [], first = null;
  while (n < l.words) {
    if (!q.length) q = shuffle(POOL.slice());
    const [t, s] = q.pop(); if (!first) first = t;
    const w = s.split(' '), take = Math.min(w.length, l.words - n);
    let part = w.slice(0, take).join(' ');
    if (take < w.length) part = part.replace(/[,;:]$/, '') + '.';
    out.push(part); n += take;
  }
  l.topic = first;
  return out.join(' ');
}

const $=s=>document.querySelector(s);
const pbox=$('#pbox'),rs=$('#rs'),inp=$('#inp'),chars=$('#chars'),caret=$('#caret'),ov=$('#ov');
const nodes={u:$('.user .node'),p:$('.pace .node')},fills={u:$('.user .fill'),p:$('.pace .fill')};
let lastY=-1,L,T,lvl=0,typed='',started=false,done=false,t0=0,total=0,errs=0,raf=0,spans=[],buckets=[],W=0,snd=true;
try{snd=localStorage.getItem('rl-snd')!=='off'}catch(e){}
const pad=n=>String(n).padStart(2,'0');
$('#segs').innerHTML='<i></i>';

/* synthesized key sounds */
let ac,nb;
function audio(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();
    nb=ac.createBuffer(1,Math.floor(ac.sampleRate*.03),ac.sampleRate);const d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
  if(ac.state==='suspended')ac.resume();return ac;
}
function click(bad){
  if(!snd||!audio())return;
  const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nb;f.type='bandpass';f.frequency.value=bad?900:2400+Math.random()*400;f.Q.value=.9;
  g.gain.setValueAtTime(bad?.28:.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);
  const o=ac.createOscillator(),og=ac.createGain();
  o.frequency.setValueAtTime(bad?110:170,t);o.frequency.exponentialRampToValueAtTime(60,t+.04);
  og.gain.setValueAtTime(.12,t);og.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(og);og.connect(ac.destination);o.start(t);o.stop(t+.06);
}
function syncSnd(){$('#snd').textContent=snd?'Sound on':'Sound off';$('#snd').setAttribute('aria-pressed',snd)}

/* rendering */
function correct(){let n=0;for(let i=0;i<typed.length;i++)if(typed[i]===T[i])n++;return n}
function accuracy(){return total?Math.round((total-errs)/total*100):100}
function render(){
  spans.forEach((s,i)=>{const t=typed[i];s.className='c'+(t==null?'':t===T[i]?' ok':' bad')});
  place();
}
function place(){
  if(!spans.length)return;
  const i=typed.length,s=spans[Math.min(i,spans.length-1)];
  caret.style.height=s.offsetHeight+'px';
  caret.style.transform=`translate(${s.offsetLeft+(i>=spans.length?s.offsetWidth:0)-1}px,${s.offsetTop}px)`;
  if(s.offsetTop!==lastY){lastY=s.offsetTop;pbox.scrollTo({top:Math.max(0,lastY-pbox.clientHeight/2+s.offsetHeight/2),behavior:'smooth'})}
}
function measure(){W=$('.user .track').clientWidth;place()}
function pos(k,p){nodes[k].style.transform=`translate3d(${p*(W-6)}px,0,0)`;fills[k].style.transform=`scaleX(${p})`}
function paint(el,wpm){$('#tm').textContent=el.toFixed(1)+'s';$('#wpm').textContent=Math.round(wpm);$('#acc').textContent=accuracy()+'%'}

function load(i){
  cancelAnimationFrame(raf);
  lvl=i;L=LV[i];T=L.text=makeText(L);typed='';started=false;done=false;total=0;errs=0;buckets=[];
  chars.innerHTML=[...T].map(c=>`<span class="c">${c}</span>`).join('');
  spans=[...chars.children];lastY=-1;pbox.scrollTop=0;
  $('#lvl').textContent='LVL '+pad(i+1);$('#tgt').textContent='TARGET: '+L.wpm+' WPM';
  $('#topic').textContent=L.topic+', '+L.words+' words';$('#pacew').textContent=L.wpm+' WPM';
  $('#segs').firstChild.style.width=((i+1)/LV.length*100)+'%';
  $('#lead').textContent='Ready';$('#lead').className='r up';
  $('#hint').classList.remove('off');caret.classList.add('idle');
  ov.classList.remove('show');inp.value='';
  measure();pos('u',0);pos('p',0);paint(0,0);render();inp.focus();
}

/* game loop */
function tick(now){
  const el=(now-t0)/1000,cc=correct(),wpm=el>.8?cc/5/(el/60):0;
  paint(el,wpm);
  pos('u',cc/T.length);pos('p',Math.min(1,el*L.wpm*5/60/T.length));
  const lead=$('#lead');
  if(el>1.5){const d=Math.round(wpm-L.wpm);
    lead.textContent=d>0?`+${d} WPM ahead`:d<0?`\u2212${-d} WPM behind`:'On pace';lead.className='r'+(d>=0?' up':'')}
  if(!done)raf=requestAnimationFrame(tick);
}
function consistency(){
  const n=Math.floor((performance.now()-t0)/1000)+1;
  let b=Array.from({length:n},(_,i)=>buckets[i]||0);if(b.length>2)b=b.slice(0,-1);
  const m=b.reduce((a,c)=>a+c,0)/b.length;if(!m)return 0;
  const cv=Math.sqrt(b.reduce((a,c)=>a+(c-m)**2,0)/b.length)/m;
  return Math.max(0,Math.round(100*(1-Math.tanh(cv+cv**3/3+cv**5/5))));
}
function finish(){
  done=true;cancelAnimationFrame(raf);
  const el=(performance.now()-t0)/1000,cc=correct(),wpm=cc/5/(el/60),con=consistency();
  paint(el,wpm);pos('u',cc/T.length);pos('p',Math.min(1,el*L.wpm*5/60/T.length));
  setTimeout(()=>show(Math.round(wpm),con,el),380);
}
function show(w,con,el){
  const win=w>=L.wpm,last=lvl===LV.length-1,b1=$('#b1'),b2=$('#b2'),d=w-L.wpm;record(win,w);
  $('#ot').textContent='Level '+pad(lvl+1);
  $('#chip').textContent=win?'PASSED':'FAILED';$('#chip').className='chip '+(win?'pass':'fail');
  $('#s1').textContent=w;$('#s2').textContent=accuracy()+'%';$('#s3').textContent=con+'%';$('#s4').textContent=el.toFixed(1)+'s';
  $('#dl').textContent=win?(d?`${d} WPM above the ${L.wpm} WPM target.`:`Exactly on the ${L.wpm} WPM target.`):`${-d} WPM below the ${L.wpm} WPM target.`;
  b1.innerHTML=(win?(last?'Restart from LVL 01':'Next level'):'Retry')+'<kbd>Enter</kbd>';
  b1.onclick=()=>load(win?(last?0:lvl+1):lvl);b2.onclick=()=>load(lvl);
  b2.hidden=!win;ov.classList.add('show');b1.focus();
}

/* input */
inp.addEventListener('input',()=>{
  if(done)return;
  const v=inp.value.slice(0,T.length),now=performance.now();
  if(!started&&v.length){started=true;t0=now;$('#hint').classList.add('off');caret.classList.remove('idle');raf=requestAnimationFrame(tick)}
  let bad=false;
  for(let i=typed.length;i<v.length;i++){total++;if(v[i]!==T[i]){errs++;bad=true}else{const k=Math.floor((now-t0)/1000);buckets[k]=(buckets[k]||0)+1}}
  if(v.length>typed.length)click(bad);
  typed=v;inp.value=v;render();
  if(typed.length===T.length)finish();
});
inp.addEventListener('paste',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  const a=document.querySelector('.ov.show');
  if(a){
    const bs=[...a.querySelectorAll('button')].filter(b=>!b.hidden);
    if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();bs[0].click()}
    if(e.key==='Tab'){e.preventDefault();const i=bs.indexOf(document.activeElement);bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus()}
    return;
  }
  if(view!=='race')return;
  if(e.key==='Escape'){load(lvl);return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))e.preventDefault();
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&document.activeElement!==inp)inp.focus();
});
document.addEventListener('pointerdown',e=>{if(view==='race'&&!document.querySelector('.ov.show')&&!e.target.closest('button'))setTimeout(()=>inp.focus(),0)});
$('#snd').onclick=()=>{snd=!snd;try{localStorage.setItem('rl-snd',snd?'on':'off')}catch(e){}syncSnd();inp.focus()};
$('#rst').onclick=()=>load(lvl);
window.addEventListener('resize',measure);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
/* app shell: tabs and saved progress */
const fresh=()=>({unlocked:1,best:Array(LV.length).fill(0),runs:0,accSum:0});
let view='race',S=fresh(),rc=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('rl-save2')||'{}'))}catch(e){}
S.best=Array.from({length:LV.length},(_,i)=>(S.best&&S.best[i])||0);S.unlocked=Math.min(Math.max(1,S.unlocked|0),LV.length);
function save(){try{localStorage.setItem('rl-save2',JSON.stringify(S))}catch(e){}}
function record(win,w){S.runs++;S.accSum+=accuracy();S.best[lvl]=Math.max(S.best[lvl]||0,w);if(win)S.unlocked=Math.max(S.unlocked,Math.min(LV.length,lvl+2));save()}
function setView(v){
  if(view==='race'&&v!=='race'&&started&&!done)load(lvl);
  view=v;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.v===v;t.classList.toggle('on',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  if(v==='levels')drawLevels();
  if(v==='stats')drawStats();
  if(v==='race'){measure();inp.focus()}
}
function drawLevels(){
  const cleared=S.best.filter((b,i)=>b>=LV[i].wpm).length;
  $('#lnote').textContent=`${cleared} of ${LV.length} cleared. Tap any unlocked level to play or replay it.`;
  $('#levels').innerHTML=LV.map((l,i)=>{const lock=i>=S.unlocked,ok=S.best[i]>=l.wpm;
    return `<button class="tile${ok?' ok':''}${i===S.unlocked-1?' cur':''}" data-i="${i}" ${lock?'disabled':''} title="${l.words} words, ${l.wpm} WPM target"><b>${i+1}</b><small>${l.words}w</small></button>`}).join('');
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{setView('race');load(+b.dataset.i)});
  const c=document.querySelector('.tile.cur');if(c)c.scrollIntoView({block:'center'});
}
function drawStats(){
  const cl=S.best.filter((b,i)=>b>=LV[i].wpm).length,best=Math.max(0,...S.best);
  $('#sgrid').innerHTML=[['Runs',S.runs],['Best WPM',best],['Avg accuracy',S.runs?Math.round(S.accSum/S.runs)+'%':'\u2013'],['Levels cleared',cl+' / '+LV.length]].map(([k,v])=>`<div><span class="label">${k}</span><b>${v}</b></div>`).join('');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
$('#reset').onclick=e=>{
  if(!rc){rc=1;e.target.textContent='Tap again to reset';setTimeout(()=>{rc=0;e.target.textContent='Reset progress'},3000);return}
  rc=0;e.target.textContent='Reset progress';S=fresh();save();drawStats();
};
function showResume(){
  const n=Math.min(S.unlocked,LV.length);
  load(n-1);
  $('#rd').textContent=`You reached Level ${n} of ${LV.length}. Your saved progress stays either way, and cleared levels can be replayed any time from the Levels tab.`;
  $('#rc1').innerHTML='Continue from Level '+n+'<kbd>Enter</kbd>';
  $('#rc1').onclick=()=>{rs.classList.remove('show');inp.focus()};
  $('#rc2').onclick=()=>{rs.classList.remove('show');load(0)};
  rs.classList.add('show');$('#rc1').focus();
}
syncSnd();
if(S.unlocked>1)showResume();else load(0);

</script>
</body>
</html>
